# set history length
set-option -g history-limit 10000

# enable clipboard
# set-option -g default-command "reattach-to-user-namespace -l $SHELL"

# Set prefix command to Ctrl-b
set -g prefix C-b

## status bar
set -g status-interval 1

# Binding to allow sending the prefix combination
bind C-a send-prefix

# Reduce tmux delay for more responsiveness
set -sg escape-time 1

# Window and pane index count starts in 1 rather than 0
set -g base-index 1
setw -g pane-base-index 1

# Dividers
bind | split-window -h
bind - split-window -v

# sesh: don't exit tmux when closing a session, skip kill-pane prompt
set -g detach-on-destroy off
bind-key x kill-pane

# sesh picker (prefix + T): fuzzy session/zoxide/configs/find via fzf
bind-key "T" run-shell "sesh connect \"$(\
  sesh list --icons | fzf-tmux -p 80%,70% \
    --no-sort --ansi --border-label ' sesh ' --prompt '⚡ ' \
    --header ' ^a all ^t tmux ^g configs ^x zoxide ^d kill ^f find' \
    --bind 'tab:down,btab:up' \
    --bind 'ctrl-a:change-prompt(⚡ )+reload(sesh list --icons)' \
    --bind 'ctrl-t:change-prompt(🪟 )+reload(sesh list -t --icons)' \
    --bind 'ctrl-g:change-prompt(⚙️  )+reload(sesh list -c --icons)' \
    --bind 'ctrl-x:change-prompt(📁 )+reload(sesh list -z --icons)' \
    --bind 'ctrl-f:change-prompt(🔎 )+reload(fd -H -d 2 -t d -E .Trash . ~)' \
    --bind 'ctrl-d:execute(tmux kill-session -t {2..})+change-prompt(⚡ )+reload(sesh list --icons)' \
    --preview-window 'right:55%' --preview 'sesh preview {}' \
)\""

# Allow mouse
# set -g mouse-utf8 on
# set -g mouse on
# bind -n WheelUpPane if-shell -Ft= '#{mouse_any_flag}' 'send-keys -M' 'if -Ft= \"#{pane_in_mode}\" \"send-keys -M\" \"copy-mode -e\"'

setw -g mouse on
bind-key -T root WheelUpPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; copy-mode -e; send-keys -M"
bind-key -T root WheelDownPane if-shell -F -t = "#{alternate_on}" "send-keys -M" "select-pane -t =; send-keys -M"

## rose-pine theme (https://github.com/rose-pine/tmux)
set -g @rose_pine_variant 'main'
run-shell '~/.tmux/plugins/rose-pine/rose-pine.tmux'
